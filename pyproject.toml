[project]
name = "lifecycle-email-builder"
version = "0.1.0"
description = "Point at a product URL and get a complete lifecycle email program with MJML templates"
readme = "README.md"
authors = [
    { name = "safakkayran", email = "safakkayran@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "typer>=0.9",
    "rich>=13.0",
    "httpx>=0.25",
    "selectolax>=0.3",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "openai>=1.0",
    "tenacity>=8.0",
]

[tool.uv.sources]
lifecycle-email-builder = { path = "." }

[tool.uv]
dev-dependencies = [
    "pytest>=7.4",
    "pytest-asyncio>=0.21",
    "respx>=0.21",
    "ruff>=0.3",
]

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py311"
preview = true
src = ["src"]
exclude = ["vendor", ".venv", "out", ".cache"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "ARG", "PLR", "PLC", "PLW", "SIM", "TCH", "TRY", "TD"]
ignore = ["TRY003", "PLR2004", "ARG001", "ARG002"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[project.scripts]
lifecycle = "lifecycle_builder.cli:app"